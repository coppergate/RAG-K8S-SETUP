machine:
  network:
    extraHostEntries:
      - ip: 192.168.1.101
        aliases:
          - registry.hierocracy.home
          - registry.container-registry.svc.cluster.local
  registries:
    mirrors:
      "hierophant.hierocracy.home:5000":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "registry.hierocracy.home:5000":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "registry.container-registry.svc.cluster.local:5000":
        endpoints:
          - "https://registry.container-registry.svc.cluster.local:5000"
      "docker.io":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "quay.io":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "registry.k8s.io":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "ghcr.io":
        endpoints:
          - "https://registry.hierocracy.home:5000"
      "*":
        endpoints:
          - "https://registry.hierocracy.home:5000"
    config:
      # The bootstrap registry uses a self-signed cert regenerated by
      # 08-setup-bootstrap-registry.sh. Trust it via insecureSkipVerify
      # (consistent with machine-patches.yaml) so a rebuilt cert never breaks
      # pulls — no stale pinned CA to keep in sync.
      "hierophant.hierocracy.home:5000":
        tls:
          insecureSkipVerify: true
      "registry.hierocracy.home:5000":
        tls:
          insecureSkipVerify: true
      "registry.container-registry.svc.cluster.local:5000":
        tls:
          insecureSkipVerify: true
