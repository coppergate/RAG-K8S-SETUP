machine:
  network:
    hostname: control-0
    interfaces:
    - interface: eth0
      # talos-nat (10.0.0.x) — bootstrap registry access and initial config apply only
      dhcp: true
    - interface: eth1
      # lb-net (172.20.x.x) — PRIMARY management interface
      # VIP 172.20.0.15 floats here on whichever control-plane node is leader
      dhcp: false
      addresses:
      - 172.20.0.100/16
      vip:
        ip: 172.20.0.15
