machine:
  network:
    hostname: inference-0
    # No extraHostEntries override needed: machine-patches.yaml already maps
    # hierophant.hierocracy.home -> 192.168.1.101, which is directly reachable
    # on the flat LAN from this physical node.
    interfaces:
    # MAC-based interface matching (deviceSelector) is used because the physical
    # NIC name (enp*, eno*, eth*) is hardware-dependent and not known in advance.
    # Talos applies this config to whichever NIC has the matching MAC.
    #
    # NOTE: This MAC must stay in sync with inference_0_mac in
    #       05-MAC-addresses.sh, which drives ARP-based maintenance-mode
    #       discovery in 45-enroll-external-node.sh. To re-read it, run
    #       'ip link show' on the node console or check BIOS/UEFI.
    - deviceSelector:
        hardwareAddr: "00:25:90:fb:71:21"   # GPU node NIC (192.168.0.4 in maintenance)
      dhcp: false
      addresses:
      - 192.168.5.31/16
      routes:
      # Default gateway — the LAN router.
      - network: 0.0.0.0/0
        gateway: 192.168.0.1
  install:
    # TODO: Confirm the install disk device name before applying.
    #       In maintenance mode: talosctl disks --insecure -n <maintenance-ip>
    #       Typically /dev/sda for a single SSD; may be /dev/nvme0n1 for NVMe.
    disk: /dev/sda
    # GPU node requires a Talos installer image with NVIDIA system extensions.
    # See EXTERNAL-NODE-SETUP.md for how to build or locate this image.
    image: hierophant.hierocracy.home:5000/siderolabs/installer-gpu:v1.12.4
    wipe: true
  # WARNING: do NOT add node-role.kubernetes.io/* here.
  #
  # The NodeRestriction admission plugin forbids a kubelet from self-assigning
  # node-role.kubernetes.io/* labels, and Talos's k8s.NodeApplyController submits
  # every entry in this map as a SINGLE patch. One rejected label therefore fails
  # the whole batch, and NONE of these labels reach the Node object:
  #
  #   nodes "inference-0" is forbidden: is not allowed to modify labels:
  #   node-role.kubernetes.io/inference
  #
  # That failure is silent from kubectl's point of view — the machine config
  # looks correct and the node simply has no labels. It is only visible in
  # 'talosctl logs controller-runtime' on the node.
  #
  # The node-role marker is applied instead with kubectl (admin credentials, not
  # the kubelet's) by the preflight in 52-install-gpu-operator.sh.
  nodeLabels:
    # Selected by 52-install-gpu-operator.sh: 'gpu' for the device plugin, GFD,
    # DCGM exporter and the Talos validation-fix DaemonSet; 'role' for the
    # node-feature-discovery worker.
    gpu: "true"
    role: inference-node
    # GPU inventory. This node is heterogeneous: 1x Tesla V100 32GB (sm_70) and
    # 2x Tesla P4 8GB (sm_61), and ALL THREE sit in one nvidia.com/gpu pool —
    # per-product resource naming is unimplemented in device plugin v0.19.3.
    #
    # gpu-pool-mixed is the one that matters: GFD's nvidia.com/gpu.* labels
    # describe the V100 only, so selecting on them can still land a pod on a P4.
    # Custom domain prefix so these cannot collide with the labels GFD owns.
    # See the "Heterogeneous GPUs" section of EXTERNAL-NODE-SETUP.md.
    hierocracy.home/gpu-total-count: "3"
    hierocracy.home/gpu-v100-count: "1"
    hierocracy.home/gpu-p4-count: "2"
    hierocracy.home/gpu-heterogeneous: "true"
    hierocracy.home/gpu-pool-mixed: "true"
    hierocracy.home/gpu-labels-describe: "tesla-v100-32gb"
    # Per-card UUIDs. Workloads pin a specific GPU by setting
    # NVIDIA_VISIBLE_DEVICES to one of these (see EXTERNAL-NODE-SETUP.md).
    # UUIDs are stable across reboots but NOT across a card being reseated or
    # replaced — re-derive with the gpu-probe recipe if the hardware changes.
    hierocracy.home/gpu-v100-uuid: "GPU-ce06ba79-6e2e-b16e-e326-3ba4747c6ecb"
    hierocracy.home/gpu-p4-0-uuid: "GPU-6a3e90b5-542c-4189-8385-62224608c4fa"
    hierocracy.home/gpu-p4-1-uuid: "GPU-d5cfa048-3ff2-dcec-f9bc-d0c7797dfbb5"
