version: v1alpha1
kind: MachineConfig
machine:
    network:
        interfaces:
            - interface: eth0
              dhcp: true
            - interface: eth1
              dhcp: false
        searchDomains:
            - "hierocracy"
            - "hierocracy.home"
        nameservers:
            - "192.168.1.210"
            - "8.8.8.8"
            - "1.1.1.1"
        extraHostEntries:
            - ip: 192.168.1.101
              aliases:
                  - hierophant.hierocracy.home
                  - hierophant
    time:
        servers:
            - "time.nist.gov"
    kernel:
        args:
            - net.ifnames=0
    install:
        extraKernelArgs:
            - net.ifnames=0
    features:
        stableHostname: false
        imageCache:
            localEnabled: true
    kubelet:
        extraArgs:
            rotate-server-certificates: "true"
        nodeIP:
            validSubnets:
                - 192.168.1.0/24
                - 172.20.0.0/16
    files:
        - content: |
            [metrics]
            address = "0.0.0.0:11234"
          path: /var/cri/conf.d/metrics.toml
          op: create
    registries:
        mirrors:
            "*":
                endpoints:
                    - http://hierophant.hierocracy.home:5000
            "hierophant.hierocracy.home:5000":
                endpoints:
                    - http://hierophant.hierocracy.home:5000
            "registry.container-registry.svc.cluster.local:5000":
                endpoints:
                    - http://172.20.1.26:5000
        config:
            "hierophant.hierocracy.home:5000":
                tls:
                    insecureSkipVerify: true
            "registry.container-registry.svc.cluster.local:5000":
                tls:
                    insecureSkipVerify: true
cluster:
    controlPlane:
        endpoint: https://10.0.0.15:6443
    extraManifests:
        - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
